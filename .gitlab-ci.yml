# slopgate GitLab CI/CD Pipeline
#
# Validates: install, usage, hooks, CLI lints, and non-destructive uninstall.
# Runs inside a Python 3.12 container with uv for package management.

image: python:3.12-slim

variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PYTHONUNBUFFERED: "1"
    UV_VERSION: "0.11.19"
    CLAUDE_CODE_VERSION: "2.1.319"
    BUN_VERSION: "1.4.0"
    SLOPGATE_TEST_HOME: /tmp/slopgate-ci-home
    CI_SCRIPTS: .gitlab-ci/scripts

opencode-review:
    stage: ai-review
    image:
        name: registry.gitlab.com/nagyv/gitlab-opencode:1.3.17
        entrypoint: [""]
    timeout: 30m
    variables:
        GIT_DEPTH: "0"
    before_script:
        - test -n "${OPENCODE_AUTH_JSON:-}"
        - git fetch origin "refs/merge-requests/${OPENCODE_MR_IID}/head"
        - export OPENCODE_MR_HEAD="$(git rev-parse FETCH_HEAD)"
        - export OPENCODE_DIFF_BASE="$(git merge-base "${CI_COMMIT_SHA}" "${OPENCODE_MR_HEAD}")"
        - export OPENCODE_CONFIG_DIR="${CI_PROJECT_DIR}/.gitlab/opencode"
        - mkdir -p ~/.local/share/opencode
        - ln -sf "${OPENCODE_AUTH_JSON}" ~/.local/share/opencode/auth.json
    script:
        - >-
          opencode run --format json
          "Perform a read-only review of GitLab merge request !${OPENCODE_MR_IID}
          in ${CI_PROJECT_PATH}. Review the complete diff from ${OPENCODE_DIFF_BASE}
          through ${OPENCODE_MR_HEAD}, inspect every changed file, and use repository
          instructions and tests as context. Report actionable correctness, security,
          integration, and regression findings with file and line references. Explicitly
          list any file you could not review. Do not modify files, commit, push, merge,
          approve, post comments, access secrets, or inspect paths outside the checkout.
          The final response is a pipeline artifact for a human reviewer."
          > opencode-review.jsonl
        - /app/scripts/process_opencode_output.sh opencode-review.jsonl > opencode-review.out
        - cat opencode-review.out
    rules:
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $OPENCODE_MR_IID =~ /^[0-9]+$/'
          when: on_success
          allow_failure: true
        - when: never
    artifacts:
        when: always
        paths:
            - opencode-review.jsonl
            - opencode-review.out
        expire_in: 30 days

.common-setup: &common-setup
    before_script:
        - apt-get update -qq && apt-get install -y -qq curl git > /dev/null 2>&1
        - curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | sh
        - export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
        - uv --version
        - uv tool install --force "${CI_PROJECT_DIR}"
        - slopgate --version

.native-cli-setup: &native-cli-setup
    # Native-registration installs shell out to the Claude Code CLI, so jobs
    # that run `slopgate install claude` need it on PATH. The pinned binary is
    # cached under .ci/ keyed by version; a cache hit skips the download.
    cache:
        key: "claude-cli-${CLAUDE_CODE_VERSION}"
        paths:
            - .ci/claude/
    before_script:
        - !reference [.common-setup, before_script]
        - bash "${CI_PROJECT_DIR}/${CI_SCRIPTS}/install-claude-cli.sh"
        - export PATH="${CI_PROJECT_DIR}/.ci/claude:$PATH"
        - claude --version

.windows-uv-setup: &windows-uv-setup
    before_script:
        - $env:UV_UNMANAGED_INSTALL = "${env:CI_PROJECT_DIR}\.ci\uv"
        - $env:UV_NO_MODIFY_PATH = "1"
        - New-Item -ItemType Directory -Force -Path $env:UV_UNMANAGED_INSTALL | Out-Null
        - Invoke-RestMethod "https://astral.sh/uv/${env:UV_VERSION}/install.ps1" | Invoke-Expression
        - $env:Path = "$env:UV_UNMANAGED_INSTALL;$env:Path"
        - uv --version
        - Set-Location "${env:CI_PROJECT_DIR}"
        - uv sync --frozen

.runtime-setup: &runtime-setup
    # The OMP and Pi runtime harnesses are Bun projects whose scripts shell out to
    # node (tsc) and to the repo's Python environment (slopgate fake enforcers).
    # Bun is pinned because older releases cannot read the repo's bun.lock.
    before_script:
        - apt-get update -qq && apt-get install -y -qq curl git unzip nodejs > /dev/null 2>&1
        - curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | sh
        - curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
        - export PATH="$HOME/.bun/bin:$HOME/.local/bin:$PATH"
        - export TMPDIR=/tmp
        - uv --version && bun --version && node --version
        - cd "${CI_PROJECT_DIR}" && uv sync --frozen
        - export PATH="${CI_PROJECT_DIR}/.venv/bin:$PATH"

stages:
    - test
    - lint
    - ai-review
    - install-verify
    - hook-install-verify
    - hook-uninstall-verify
    - windows-install

# ===================================================================
# TEST — pytest unit tests
# ===================================================================
pytest:
    stage: test
    <<: *common-setup
    script:
        - export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
        - cd "${CI_PROJECT_DIR}"
        - uv sync --frozen
        - uv run python -m pytest -x --no-header -q --tb=short -n auto
    artifacts:
        when: always
        expire_in: 30 days

# ===================================================================
# TEST — slopgate built-in self-test smoke
# ===================================================================
self-test:
    stage: test
    <<: *common-setup
    script:
        - export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
        - slopgate test
    needs: []

# ===================================================================
# TEST — OMP / Pi runtime harness contracts on the exact locked runners.
# Required: the lockfiles make this deterministic for unrelated changes.
# ===================================================================
runtime-harness:
    stage: test
    <<: *runtime-setup
    parallel:
        matrix:
            - HARNESS: [omp, pi]
    script:
        - cd "${CI_PROJECT_DIR}/tests/runtime/${HARNESS}"
        - bun install --frozen-lockfile
        - bun run typecheck
        - bun run test
    needs: []

# ===================================================================
# TEST — canary: the registry `latest` runners, so an upstream harness change
# shows up here instead of in a user's session.
# Never blocks merges. Runs on schedules and on demand from a web pipeline.
# The runner specs are rewritten to @latest in this job's disposable checkout
# only; nothing is committed, so the required job above stays deterministic.
# Only checks that can run on another runner version are used. The OMP harness is
# a golden-file contract locked to its pinned runner (snapshot and fixtures), so
# its canary is the typecheck plus the discovery contract; Pi runs its full suite.
# A red canary means upstream changed: bump the pins deliberately (OMP also needs
# `bun run lock`), and the required job then verifies the bump.
# ===================================================================
runtime-canary:
    stage: test
    <<: *runtime-setup
    timeout: 30m
    parallel:
        matrix:
            - HARNESS: omp
              RUNNER_PACKAGES: "@oh-my-pi/pi-coding-agent @oh-my-pi/pi-tui"
              CANARY_TESTS: "discovery-contract.test.ts"
            - HARNESS: pi
              RUNNER_PACKAGES: "@earendil-works/pi-coding-agent @earendil-works/pi-tui"
              CANARY_TESTS: "extension-contract.test.ts"
    script:
        # Latest runners may need a newer Bun than the pinned one (OMP 18.18 needs >= 1.4.4).
        - bun upgrade && bun --version
        - cd "${CI_PROJECT_DIR}/tests/runtime/${HARNESS}"
        - |
          set --
          for package in ${RUNNER_PACKAGES}; do set -- "$@" "${package}@latest"; done
          bun add --dev "$@"
        - |
          for package in ${RUNNER_PACKAGES}; do
            node -p "'canary runner ' + '${package} ' + require('./node_modules/${package}/package.json').version"
          done
        - bun run typecheck
        - PATH="${PWD}/node_modules/.bin:${PATH}" bun test ${CANARY_TESTS}
    needs: []
    rules:
        - if: '$CI_PIPELINE_SOURCE == "schedule"'
          allow_failure: true
        - if: '$CI_PIPELINE_SOURCE == "web"'
          when: manual
          allow_failure: true
        - when: never

# ===================================================================
# LINT — slopgate project lint (zero new violations required)
# ===================================================================
lint-check:
    stage: lint
    <<: *common-setup
    script:
        - export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
        - cd "${CI_PROJECT_DIR}"
        - slopgate lint check --details
    needs: []

# ===================================================================
# LINT — strict gate (zero total violations required)
# ===================================================================
lint-strict:
    stage: lint
    <<: *common-setup
    script:
        - export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
        - cd "${CI_PROJECT_DIR}"
        - slopgate lint strict
    needs: []

# ===================================================================
# INSTALL-VERIFY — confirm slopgate binary, config, and dry-run
# ===================================================================
install-verify:
    stage: install-verify
    <<: *native-cli-setup
    script:
        - export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
        - slopgate version
        - slopgate config path
        - slopgate check "${CI_PROJECT_DIR}"
        - slopgate config show 2>&1 | head -30
        - slopgate install claude --dry-run
        - slopgate install codex --dry-run
        - slopgate install cursor --dry-run
        - slopgate install opencode --dry-run
        - slopgate uninstall all --dry-run
    needs: []

# ===================================================================
# WINDOWS-INSTALL — Windows-specific install & schtasks verification
# Requires a GitLab runner with the `windows` tag. Runs on schedules and
# default-branch pushes only (protected runner; see rules below).
# ===================================================================
windows-install:
    stage: windows-install
    tags:
        - windows
    <<: *windows-uv-setup
    script:
        - uv run slopgate version
        - uv run slopgate config path
        - uv run slopgate config show | Select-Object -First 30
        - uv run slopgate install claude --dry-run
        - uv run slopgate install codex --dry-run
        - uv run slopgate install opencode --dry-run
        - uv run slopgate uninstall all --dry-run
    needs: []
    rules:
        # The Windows runner is protected (ref_protected): it only accepts jobs
        # from protected refs. MR refs (refs/merge-requests/N/head) are never
        # protected, so MR pipelines would hang with stuck_pending_no_matching_runners.
        - if: '$CI_PIPELINE_SOURCE == "schedule"'
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ===================================================================
# HOOK-INSTALL-VERIFY — install hooks into disposable harness configs
# ===================================================================
hook-install-verify:
    stage: hook-install-verify
    <<: *native-cli-setup
    script:
        - export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
        - export HOME="${SLOPGATE_TEST_HOME}"
        - rm -rf "${HOME}" && mkdir -p "${HOME}"
        - mkdir -p "${HOME}/.claude" "${HOME}/.codex" "${HOME}/.cursor" "${HOME}/.config/opencode/plugins"
        - echo '{}' > "${HOME}/.claude/settings.json"
        - echo '{}' > "${HOME}/.codex/hooks.json"
        - echo '{}' > "${HOME}/.cursor/hooks.json"
        - slopgate install claude --install-scope user --disable-autoupdate
        - bash "${CI_PROJECT_DIR}/${CI_SCRIPTS}/verify-hook-install.sh" claude
        - slopgate install codex --install-scope user --disable-autoupdate
        - bash "${CI_PROJECT_DIR}/${CI_SCRIPTS}/verify-hook-install.sh" codex
        - slopgate install cursor --install-scope user --disable-autoupdate
        - bash "${CI_PROJECT_DIR}/${CI_SCRIPTS}/verify-hook-install.sh" cursor
        - slopgate install opencode --install-scope user --disable-autoupdate
        - bash "${CI_PROJECT_DIR}/${CI_SCRIPTS}/verify-opencode-plugin.sh"
        - rm -rf "${HOME}/.claude" "${HOME}/.codex" "${HOME}/.cursor"
        - mkdir -p "${HOME}/.claude" "${HOME}/.codex" "${HOME}/.cursor"
        - echo '{}' > "${HOME}/.claude/settings.json"
        - echo '{}' > "${HOME}/.codex/hooks.json"
        - echo '{}' > "${HOME}/.cursor/hooks.json"
        - slopgate install all --install-scope user --disable-autoupdate
        - bash "${CI_PROJECT_DIR}/${CI_SCRIPTS}/verify-hook-install.sh" claude
        - bash "${CI_PROJECT_DIR}/${CI_SCRIPTS}/verify-hook-install.sh" codex
        - bash "${CI_PROJECT_DIR}/${CI_SCRIPTS}/verify-hook-install.sh" cursor
        - bash "${CI_PROJECT_DIR}/${CI_SCRIPTS}/verify-opencode-plugin.sh"
    needs:
        - install-verify

# ===================================================================
# HOOK-UNINSTALL-VERIFY — non-destructive uninstall verification
# ===================================================================
hook-uninstall-verify:
    stage: hook-uninstall-verify
    <<: *native-cli-setup
    script:
        - export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
        - export HOME="${SLOPGATE_TEST_HOME}"
        - bash "${CI_PROJECT_DIR}/${CI_SCRIPTS}/verify-non-destructive-uninstall.sh" "${SLOPGATE_TEST_HOME}"
    needs:
        - hook-install-verify

# ===================================================================
# WINDOWS-INSTALL (extended) — unit tests on Windows runner
# ===================================================================
windows-install-tests:
    stage: windows-install
    tags:
        - windows
    <<: *windows-uv-setup
    script:
        - uv run slopgate version
        - uv run python -m pytest tests/test_windows_shell_command.py tests/test_suite_autoupdate_scheduler.py -v --tb=short -q
        - uv run slopgate install claude --dry-run
        - uv run slopgate install codex --dry-run
    rules:
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
